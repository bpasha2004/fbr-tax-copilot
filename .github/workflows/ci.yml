name: test-and-evaluate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    # Spins up a Redis service container for pytest in CI
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Evaluation
        run: python -m eval.run

      - name: Compile
        run: python -m compileall -q .

      - name: Dependency security audit
        run: python -m pip_audit -r requirements.txt --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-1325
